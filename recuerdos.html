<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tu ❤️</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #18000d, #52002a);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 35px 15px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .subtitulo {
      color: #ffd6e5;
      margin-bottom: 30px;
    }

    .galeria {
      max-width: 500px;
      margin: auto;
    }

    .foto {
      display: none;
      animation: aparecer .7s ease;
    }

    .foto.activa {
      display: block;
    }

    .foto img {
      width: 100%;
      max-height: 500px;
      object-fit: contain;
      border-radius: 22px;
      box-shadow: 0 10px 40px rgba(0,0,0,.4);
    }

    .numero {
      margin-top: 15px;
      color: #ffc5da;
    }

    .botones {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 25px;
    }

    button {
      border: none;
      border-radius: 50px;
      padding: 14px 22px;
      background: #ff2f75;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .4;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: scale(.92);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>

<body>

  <h1>la mujer que amo ❤️</h1>

  <p class="subtitulo">
    mis fotos favoritas, se que te lo dicen mucho, eres demasiado bella.
  </p>

  <div class="galeria">

    <div class="foto activa">
      <img src="foto1.jpg" alt="Nuestro recuerdo 1">
      <p class="numero">1 / 5</p>
    </div>

    <div class="foto">
      <img src="foto2.jpg" alt="Nuestro recuerdo 2">
      <p class="numero">2 / 5</p>
    </div>

    <div class="foto">
      <img src="foto3.jpg" alt="Nuestro recuerdo 3">
      <p class="numero">3 / 5</p>
    </div>

    <div class="foto">
      <img src="foto4.jpg" alt="Nuestro recuerdo 4">
      <p class="numero">4 / 5</p>
    </div>

    <div class="foto">
      <img src="foto5.jpg" alt="Nuestro recuerdo 5">
      <p class="numero">5 / 5</p>
    </div>

    <div class="botones">
      <button id="anterior" onclick="cambiar(-1)" disabled>
        ← Anterior
      </button>

      <button id="siguiente" onclick="cambiar(1)">
        Siguiente →
      </button>
    </div>

  </div>

  <script>

    let actual = 0;

    const fotos = document.querySelectorAll(".foto");

    function cambiar(direccion) {

      fotos[actual].classList.remove("activa");

      actual += direccion;

      if (actual < 0) {
        actual = 0;
      }

      if (actual >= fotos.length) {
        actual = fotos.length - 1;
      }

      fotos[actual].classList.add("activa");

      document.getElementById("anterior").disabled = actual === 0;

      document.getElementById("siguiente").disabled =
        actual === fotos.length - 1;
    }

  </script>

</body>
</html>
