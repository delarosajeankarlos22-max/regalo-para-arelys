<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestros recuerdos ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #18000d, #52002a);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px 15px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 34px;
    }

    .subtitulo {
      color: #ffd6e5;
      margin-bottom: 30px;
    }

    .galeria {
      width: 100%;
      max-width: 500px;
      margin: auto;
    }

    .foto {
      display: none;
    }

    .foto.activa {
      display: block;
      animation: aparecer 0.6s ease;
    }

    .foto img {
      width: 100%;
      max-width: 500px;
      max-height: 60vh;
      object-fit: contain;
      border-radius: 22px;
      display: block;
      margin: auto;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }

    .numero {
      color: #ffc5da;
      margin-top: 15px;
    }

    .botones {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 25px;
    }

    button {
      border: none;
      border-radius: 50px;
      padding: 14px 22px;
      background: #ff2f75;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.4;
    }

    .volver {
      margin-top: 20px;
      background: rgba(255,255,255,0.15);
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: scale(0.94);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>

<body>

  <h1>Nuestros recuerdos ❤️</h1>

  <p class="subtitulo">
    Cada foto guarda un momento especial.
  </p>

  <div class="galeria">

    <div class="foto activa">
      <img src="foto1.jpg" alt="Recuerdo 1">
      <p class="numero">1 / 5</p>
    </div>

    <div class="foto">
      <img src="foto2.jpg" alt="Recuerdo 2">
      <p class="numero">2 / 5</p>
    </div>

    <div class="foto">
      <img src="foto3.jpg" alt="Recuerdo 3">
      <p class="numero">3 / 5</p>
    </div>

    <div class="foto">
      <img src="foto4.jpg" alt="Recuerdo 4">
      <p class="numero">4 / 5</p>
    </div>

    <div class="foto">
      <img src="foto5.jpg" alt="Recuerdo 5">
      <p class="numero">5 / 5</p>
    </div>

    <div class="botones">
      <button id="anterior" onclick="cambiar(-1)" disabled>
        ← Anterior
      </button>

      <button id="siguiente" onclick="cambiar(1)">
        Siguiente →
      </button>
    </div>

    <button class="volver" onclick="volverCarta()">
      ❤️ Volver a la sorpresa
    </button>

  </div>

  <script>
    let actual = 0;

    const fotos = document.querySelectorAll(".foto");
    const anterior = document.getElementById("anterior");
    const siguiente = document.getElementById("siguiente");

    function cambiar(direccion) {

      fotos[actual].classList.remove("activa");

      actual = actual + direccion;

      if (actual < 0) {
        actual = 0;
      }

      if (actual >= fotos.length) {
        actual = fotos.length - 1;
      }

      fotos[actual].classList.add("activa");

      anterior.disabled = actual === 0;
      siguiente.disabled = actual === fotos.length - 1;
    }

    function volverCarta() {
      window.location.href = "carta.html";
    }
  </script>

</body>
</html>
