<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuerdos ❤️</title>
</head>

<body style="background:#22000f;color:white;text-align:center;font-family:Arial;padding:30px">

  <h1>Nuestros recuerdos ❤️</h1>

  <img id="foto" src="foto1.jpg"
       style="width:90%;max-width:450px;border-radius:20px">

  <br><br>

  <button onclick="anterior()">← Anterior</button>
  <button onclick="siguiente()">Siguiente →</button>

  <br><br>

  <button onclick="location.href='carta.html'">
    ❤️ Volver a la sorpresa
  </button>

  <script>
    const fotos = [
      "foto1.jpg",
      "foto2.jpg",
      "foto3.jpg",
      "foto4.jpg",
      "foto5.jpg"
    ];

    let posicion = 0;

    function siguiente() {
      if (posicion < fotos.length - 1) {
        posicion++;
        document.getElementById("foto").src = fotos[posicion];
      }
    }

    function anterior() {
      if (posicion > 0) {
        posicion--;
        document.getElementById("foto").src = fotos[posicion];
      }
    }
  </script>

</body>
</html>
