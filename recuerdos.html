<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>my love ❤️</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #18000d, #52002a);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px 15px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .subtitulo {
      color: #ffd6e5;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .galeria {
      width: 100%;
      max-width: 500px;
      margin: auto;
    }

    .foto {
      display: none;
      animation: aparecer 0.7s ease;
    }

    .foto.activa {
      display: block;
    }

    .foto img {
      display: block;
      width: 100%;
      max-width: 500px;
      height: auto;
      max-height: 60vh;
      object-fit: contain;
      margin: auto;
      border-radius: 22px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
    }

    .numero {
      margin-top: 15px;
      color: #ffc5da;
      font-size: 15px;
    }

    .botones {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 25px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 50px;
      padding: 14px 22px;
      background: #ff2f75;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .volver {
      margin-top: 25px;
      background: rgba(255,255,255,0.12);
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: scale(0.94);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>

<body>

  <h1>my hearth❤️</h1>

  <p class="subtitulo">
  la mujer que amo❤️
  </p>

  <div class="galeria">

    <div class="foto activa">
      <img src="./foto1.jpg" alt="Nuestro recuerdo 1">
      <p class="numero">1 / 5</p>
    </div>

    <div class="foto">
      <img src="./foto2.jpg" alt="Nuestro recuerdo 2">
      <p class="numero">2 / 5</p>
    </div>

    <div class="foto">
      <img src="./foto3.jpg" alt="Nuestro recuerdo 3">
      <p class="numero">3 / 5</p>
    </div>

    <div class="foto">
      <img src="./foto4.jpg" alt="Nuestro recuerdo 4">
      <p class="numero">4 / 5</p>
    </div>

    <div class="foto">
      <img src="./foto5.jpg" alt="Nuestro recuerdo 5">
      <p class="numero">5 / 5</p>
    </div>

    <div class="botones">

      <button id="anterior" onclick="cambiar(-1)" disabled>
        ← Anterior
      </button>

      <button id="siguiente" onclick="cambiar(1)">
        Siguiente →
      </button>

    </div>

    <button class="volver" onclick="volverCarta()">
      ❤️ Volver a la sorpresa
    </button>
<button class="final" onclick="irFinal()">
  💌 Hay algo más...
</button>
    
  </div>

  <script>

    let actual = 0;

    const fotos = document.querySelectorAll(".foto");

    const anterior = document.getElementById("anterior");

    const siguiente = document.getElementById("siguiente");

    function cambiar(direccion) {

      fotos[actual].classList.remove("activa");

      actual += direccion;

      if (actual < 0) {
        actual = 0;
      }

      if (actual >= fotos.length) {
        actual = fotos.length - 1;
      }

      fotos[actual].classList.add("activa");

      anterior.disabled = actual === 0;

      siguiente.disabled = actual === fotos.length - 1;

    }

    function volverCarta() {

      window.location.href = "carta.html";

    }
function irFinal() {

  window.location.href = "final.html";

}
    .final {
  margin-top: 12px;
  background: #ff4f91;
}
  </script>

</body>
</html>
